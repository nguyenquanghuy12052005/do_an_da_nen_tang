name: LingoSign signed Android build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lingosign-android-release
  cancel-in-progress: false

jobs:
  signed-build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: LingoSign_Agent_Skills_Bundle_Resume_Ready
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Verify source and tests
        run: |
          dart run build_runner build --delete-conflicting-outputs
          test -z "$(git status --porcelain --untracked-files=all -- lib/data/local/app_database.g.dart)"
          dart run drift_dev schema dump lib/data/local/app_database.dart drift_schemas/
          test -z "$(git status --porcelain --untracked-files=all -- drift_schemas/)"
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-infos
          flutter test --test-randomize-ordering-seed random --reporter expanded
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo '::error::ANDROID_KEYSTORE_BASE64 secret is missing.'
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lingosign-upload.jks"
          test -s "$RUNNER_TEMP/lingosign-upload.jks"
          chmod 600 "$RUNNER_TEMP/lingosign-upload.jks"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install pinned Fastlane
        working-directory: LingoSign_Agent_Skills_Bundle_Resume_Ready/android
        run: bundle install
      - name: Build signed APK and AAB with Fastlane
        working-directory: LingoSign_Agent_Skills_Bundle_Resume_Ready/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/lingosign-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bundle exec fastlane android build_signed
      - name: Upload signed artifacts and symbols
        uses: actions/upload-artifact@v4
        with:
          name: lingosign-android-signed-${{ github.run_number }}
          path: |
            LingoSign_Agent_Skills_Bundle_Resume_Ready/build/app/outputs/flutter-apk/app-release.apk
            LingoSign_Agent_Skills_Bundle_Resume_Ready/build/app/outputs/bundle/release/app-release.aab
            LingoSign_Agent_Skills_Bundle_Resume_Ready/build/symbols/
          if-no-files-found: error
          retention-days: 30
