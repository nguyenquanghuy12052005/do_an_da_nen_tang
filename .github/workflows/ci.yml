name: LingoSign CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lingosign-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: LingoSign_Agent_Skills_Bundle_Resume_Ready
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Verify generated Drift code
        run: |
          dart run build_runner build --delete-conflicting-outputs
          if [ -n "$(git status --porcelain --untracked-files=all -- lib/data/local/app_database.g.dart)" ]; then
            echo '::error::Drift generated code is stale or missing.'
            exit 1
          fi
      - name: Verify Drift schema snapshot
        run: |
          dart run drift_dev schema dump lib/data/local/app_database.dart drift_schemas/
          if [ -n "$(git status --porcelain --untracked-files=all -- drift_schemas/)" ]; then
            echo '::error::Drift schema snapshot is stale or missing.'
            exit 1
          fi
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze Dart code
        run: flutter analyze --fatal-infos
      - name: Run tests
        run: flutter test --test-randomize-ordering-seed random --reporter expanded
      - name: Build Android debug APK
        run: flutter build apk --debug
